# Adapted from the qie-smart-contracts build-test fixture (release 0.6.0-ecosystem.2,
# release id 3aa11f7a34b9db51b1b9de243a4642af4eed6fe734c24e287ad0bd93888bd11b).
# Toolchain pins: forge 1.8.1 (982849d3140c01fd3b72905759581a132df7aa98),
# solc 0.8.37+commit.f401782d, evm_version paris. No external libraries.
# Invariant profile (runs/depth) is a project-local addition, not a fixture value.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
solc_version = "0.8.37"
evm_version = "paris"
optimizer = false
bytecode_hash = "none"

# P0.1: isolate optimized v1 roots; preserve default legacy compiler/runtime identity.
additional_compiler_profiles = [{ name = "orakl", optimizer = true, optimizer_runs = 50, via_ir = false }]
compilation_restrictions = [
    { paths = "src/SelectedMarketFactory.sol", optimizer_runs = 50 },
    { paths = "src/MarketFactory.sol", optimizer_runs = 50 },
    { paths = "src/ProtocolConfig.sol", optimizer_runs = 50 },
]

[profile.default.fuzz]
runs = 2048
seed = "0x4f52414b4c503031"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

# Preserve the legacy artifact/source and historical test formatting byte-for-byte.
# All new ORAKL source, tests and scripts remain covered by forge fmt --check.
[fmt]
ignore = ["src/QiePredictionMarket.sol", "test/QiePredictionMarket.t.sol", "test/QiePredictionMarketInvariant.t.sol", "test/helpers/TestBase.sol", "test/helpers/Vm.sol", "test/doubles/NativeReentrancy.sol"]
